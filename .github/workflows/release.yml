name: Release

on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - uses: actions/cache@v6
        with:
          path: |
            .cache/downloads
            .cache/zig-global
            .deps
          key: toolchain-${{ hashFiles('scripts/zig.mjs', 'scripts/build-deps.mjs', 'scripts/targets.mjs') }}

      - run: npm ci

      - run: npm run build

      - name: Verify prebuilds
        run: |
          for f in \
            linux-x64/nftables-napi.glibc.node \
            linux-x64/nftables-napi.musl.node \
            linux-arm64/nftables-napi.glibc.node \
            linux-arm64/nftables-napi.musl.node; do
            test -f "prebuilds/$f" || { echo "missing prebuild: $f"; exit 1; }
            if readelf -d "prebuilds/$f" | grep -E 'NEEDED.*(libnftnl|libmnl|libstdc\+\+)'; then
              echo "prebuilds/$f dynamically links a library it should have bundled"
              exit 1
            fi
            max=$(readelf -W -V "prebuilds/$f" \
              | grep -oE 'GLIBC_2\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBC_//' | sort -uV | tail -1)
            if [ -n "$max" ] && [ "$(printf '%s\n2.28\n' "$max" | sort -V | tail -1)" != "2.28" ]; then
              echo "prebuilds/$f needs glibc $max, above the documented 2.28 floor"
              exit 1
            fi
            echo "ok  prebuilds/$f${max:+  (glibc <= $max)}"
          done

      - name: Publish to NPM
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
