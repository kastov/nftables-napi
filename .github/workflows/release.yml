name: Release

on:
  push:
    tags:
      - "*"

permissions:
  id-token: write
  contents: write

jobs:
  prebuild:
    if: ${{ !endsWith(github.ref_name, '-ros') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: x64
            libc: musl
            dockerfile: Dockerfile
          - platform: linux/arm64
            arch: arm64
            libc: musl
            dockerfile: Dockerfile
          - platform: linux/amd64
            arch: x64
            libc: glibc
            dockerfile: Dockerfile.debian
          - platform: linux/arm64
            arch: arm64
            libc: glibc
            dockerfile: Dockerfile.debian
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'

      - name: Build ${{ matrix.libc }} prebuild (${{ matrix.arch }})
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --output type=local,dest=./out \
            -f ./${{ matrix.dockerfile }} \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: out/prebuilds/

  release:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: prebuilds-tmp/

      - name: Merge prebuilds
        run: |
          mkdir -p prebuilds
          # Artifacts each hold linux-<arch>/nftables-napi.<libc>.node; tags
          # differ so directories merge without clobbering.
          cp -r prebuilds-tmp/*/* prebuilds/
          echo "Prebuilds:"
          find prebuilds -type f
          for f in \
            linux-x64/nftables-napi.musl.node \
            linux-x64/nftables-napi.glibc.node \
            linux-arm64/nftables-napi.musl.node \
            linux-arm64/nftables-napi.glibc.node; do
            test -f "prebuilds/$f" || { echo "Missing prebuild: $f"; exit 1; }
          done

      - run: npm install --ignore-scripts

      - name: Publish to NPM
        run: npm publish --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
